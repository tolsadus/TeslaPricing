name: Scrape

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      scraper:
        description: Which scraper to run (leave empty to run all)
        required: false
        default: ''
        type: choice
        options:
          - ''
          - capcar
          - gmecars
          - heycar
          - lbauto
          - renew
          - mmxbv
          - nikola
          - ewigo

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        env:
          ONLY: ${{ inputs.scraper }}
        run: |
          all='[
            {"scraper":"capcar","args":"--pages 20"},
            {"scraper":"gmecars","args":"--pages 2"},
            {"scraper":"lbauto","args":"--pages 10"},
            {"scraper":"heycar","args":""},
            {"scraper":"renew","args":"--pages 5"},
            {"scraper":"mmxbv","args":""},
            {"scraper":"nikola","args":""},
            {"scraper":"ewigo","args":""}
          ]'
          if [ -z "$ONLY" ]; then
            matrix=$(echo "$all" | jq -c '{include: .}')
          else
            matrix=$(echo "$all" | jq -c --arg s "$ONLY" '{include: [.[] | select(.scraper == $s)]}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  scrape:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.scraper }}
        run: node scraper/cli.js ${{ matrix.scraper }} ${{ matrix.args }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
